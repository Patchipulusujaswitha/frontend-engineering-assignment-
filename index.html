
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Echoes - Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="music-container">

    <div class="album-section">

        <div class="album-cover">
            <div class="vinyl">
                <div class="vinyl-center"></div>
            </div>
        </div>

        <h2>Midnight Echoes</h2>

        <p class="artist">Cyber Wave • 2026</p>

        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <div class="time">
            <span>0:00</span>
            <span>3:42</span>
        </div>

        <div class="controls">

            <button class="previous" type="button">⏮</button>

            <button class="play" type="button">▶</button>

            <button class="next" type="button">⏭</button>

        </div>

    </div>

    <div class="playlist-section">

        <h2>Up Next</h2>

        <div class="track active">
            <div class="track-info">
                <span class="number">01.</span>
                <span>Neon Route</span>
            </div>
            <span class="duration">3:42</span>
        </div>

        <div class="track">
            <div class="track-info">
                <span class="number">02.</span>
                <span>Silicon Drift</span>
            </div>
            <span class="duration">4:15</span>
        </div>

        <div class="track">
            <div class="track-info">
                <span class="number">03.</span>
                <span>Digital Rain</span>
            </div>
            <span class="duration">2:58</span>
        </div>

        <div class="track">
            <div class="track-info">
                <span class="number">04.</span>
                <span>Night Ride</span>
            </div>
            <span class="duration">3:10</span>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
